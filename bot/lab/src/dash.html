<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPY Bot Lab monitor</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#5d6673;--line:#e1e5eb;--ok:#1a7f4b;--okbg:#e4f5ec;--warn:#9a5b00;--warnbg:#fdf0d8;--bad:#b3261e;--badbg:#fbe4e2;--info:#1d5fd1;--infobg:#e3edfd;--bar:#2b6cb0;--barbg:#e6ebf2;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--ink:#e8ecf1;--mute:#97a1ae;--line:#262d37;--ok:#5fd39b;--okbg:#12301f;--warn:#f0b64a;--warnbg:#33260c;--bad:#ff8a80;--badbg:#3a1714;--info:#8ab4ff;--infobg:#142544;--bar:#6aa3ff;--barbg:#222a35;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 16px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:26px 0 10px;font-weight:650}
.sub{color:var(--mute);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.pill i{width:9px;height:9px;border-radius:50%;background:currentColor;display:inline-block}
.ok{color:var(--ok);background:var(--okbg)}.attention{color:var(--warn);background:var(--warnbg)}.stopped,.bad{color:var(--bad);background:var(--badbg)}.info{color:var(--info);background:var(--infobg)}.mute{color:var(--mute);background:var(--barbg)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .v{font-size:26px;font-weight:650;line-height:1.1}.kpi .l{color:var(--mute);font-size:12px;margin-top:4px}
.kpi .n{font-size:12px;color:var(--mute);margin-top:2px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row b{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;color:var(--mute);text-align:left;font-size:12px;border-bottom:1px solid var(--line);padding:6px 8px 6px 0;white-space:nowrap}
td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;margin:0 4px 3px 0}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
ul.clean{margin:0;padding-left:18px}ul.clean li{margin:3px 0}
.empty{color:var(--mute);font-style:italic}
.ticks{display:grid;gap:3px;overflow-x:auto;padding-bottom:4px}
.tickrow{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);white-space:nowrap}
.tickrow .t{width:92px;flex:none}
.cell{width:14px;height:14px;border-radius:3px;flex:none;background:var(--barbg)}
.cell.s-ok{background:var(--ok)}.cell.s-skipped{background:#98a2b3}.cell.s-failed{background:var(--bad)}.cell.s-blocked{background:var(--warn)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
svg text{fill:var(--mute);font-size:10px}
.err{color:var(--bad)}
.org{display:grid;gap:6px}
.tier{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.node{flex:1 1 150px;max-width:230px;border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:10px;padding:8px 10px;background:var(--card)}
.node b{display:block;font-size:13px}.node .r{font-size:11.5px;color:var(--mute);margin-top:2px}.node .s{font-size:11px;margin-top:4px}
.flow{text-align:center;font-size:11px;color:var(--mute)}
.tierlabel{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-top:4px}
.team{border:2px solid #8a5cf6;border-radius:14px;padding:10px;background:color-mix(in srgb,#8a5cf6 6%,var(--card))}

details.group{margin-top:22px}details.group>summary{cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:650}
@media (max-width:520px){h1{font-size:18px}.kpi .v{font-size:22px}}
#better .banner{margin-bottom:10px;padding:14px 16px;border-radius:10px;border:2px solid var(--ok);background:var(--okbg);color:var(--ink);animation:flash 1.1s steps(2,jump-none) infinite}
#better .banner b{color:var(--ok)}
#better .quiet{margin-bottom:8px;font-size:13px;color:var(--mute)}
@keyframes flash{0%{background:var(--okbg);border-color:var(--ok)}100%{background:var(--card);border-color:var(--info)}}
@media (prefers-reduced-motion:reduce){#better .banner{animation-duration:3s}}
.pos{color:var(--ok)}.neg{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>SPY Bot Lab monitor</h1>
      <div class="sub" id="meta">loading…</div>
    </div>
    <div id="status" class="pill mute"><i></i><span>connecting</span></div>
  </header>
  <div id="fresh" style="margin-bottom:10px"></div>
  <div id="better"></div>
  <div id="alerts"></div>
  <div id="app"></div>
  <div class="card" id="livelogs" style="margin-top:16px;padding:14px">
    <h2 style="margin:0 0 8px">Live logs <span class="sub" id="logmeta"></span></h2>
    <div id="logtabs" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px"></div>
    <div style="overflow-x:auto"><pre id="logtext" style="margin:0;max-height:420px;overflow:auto;font-size:12px;white-space:pre">loading…</pre></div>
  </div>
</div>
<script>
"use strict";
// The first element matching CSS selector `s`.
const $=s=>document.querySelector(s);
// Creates element `tag` with attributes and children (text or nodes).
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else e.setAttribute(k,v);}
  for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)));}return e;}
// Number with up to `d` decimals, locale-formatted ('—' when missing).
const fmt=(x,d=2)=>x==null||Number.isNaN(x)?"—":Number(x).toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:0});
// Signed number with `d` decimals ('—' when missing).
const sgn=(x,d=4)=>x==null||Number.isNaN(x)?"—":(x>=0?"+":"")+Number(x).toFixed(d);
// Signed whole USD amount ('—' when missing).
const usd=x=>x==null||Number.isNaN(x)?"—":(x>=0?"+":"−")+Math.abs(Number(x)).toLocaleString(undefined,{maximumFractionDigits:0});
// How long ago unix time `ts` was, relative to `now`.
function ago(ts,now){if(!ts)return"never";const s=Math.max(0,now-ts);if(s<90)return s+"s ago";if(s<5400)return Math.round(s/60)+" min ago";if(s<172800)return Math.round(s/3600)+" h ago";return Math.round(s/86400)+" d ago";}
// Unix time `ts` as a short local date and time.
function dt(ts){return ts?new Date(ts*1000).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—";}
// A coloured status badge.
function pill(level,text){return h("span",{class:"badge "+level},text);}
// A horizontal progress bar filled to `frac` (0..1).
// A card with an optional title and body elements.
function card(title,...body){return h("div",{class:"card"},title?h("div",{class:"sub",style:"margin-bottom:8px;font-weight:600"},title):null,...body);}
// A table with header `head`, rows `rows`, right-aligned numeric columns `numCols`.
function table(head,rows,numCols=[]){const t=h("table",null,h("thead",null,h("tr",null,head.map((c,i)=>h("th",{class:numCols.includes(i)?"num":""},c)))),
  h("tbody",null,rows.map(r=>h("tr",null,r.map((c,i)=>h("td",{class:numCols.includes(i)?"num":""},c))))));return h("div",{class:"scroll"},t);}
// Daily PnL bar chart: green up for winning days, red down for losing days, grey for days with no closed trade.
function pnlBars(series,w=520,hgt=170){ // series: [{label,pnl,pct,trades,wins,losses}] green up = winning day, red down = losing day
  const ns="http://www.w3.org/2000/svg";if(!series.length){return h("div",{class:"empty"},"no trades yet");}
  const svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox",`0 0 ${w} ${hgt}`);svg.setAttribute("width","100%");svg.style.font="9px system-ui";
  const T=14,B=16,mid=(hgt-T-B)/2+T,half=(hgt-T-B)/2-10,max=Math.max(...series.map(s=>Math.abs(s.pct||0)),0.01),step=(w-30)/series.length,bw=Math.max(3,Math.min(26,step-3));
  const add=(tag,a,txt)=>{const e=document.createElementNS(ns,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.append(e);return e;};
  add("line",{x1:20,x2:w,y1:mid,y2:mid,stroke:"var(--line,#ccc)","stroke-width":1});
  const every=Math.max(1,Math.ceil(30/step));let lastLabel=-every; // a % label needs ~30 units: thin by spacing, not index (hover shows every value)
  series.forEach((s,i)=>{const x=24+i*step;
    if(s.none){const r=add("rect",{x:x,y:mid-2,width:bw,height:4,rx:2,fill:"#8c959f"});const t=document.createElementNS(ns,"title");t.textContent=s.label+": no closed trade ("+(s.runs??"?")+" runs covered this day, 0 USD)";r.append(t);
      if(step>=14)add("text",{x:x+bw/2,y:mid-5,"text-anchor":"middle",fill:"#8c959f"},"—");if(i%Math.ceil(series.length/8)===0)add("text",{x:x,y:hgt-3,fill:"currentColor"},s.label);return;}
    const known=s.pct!=null,v=known?s.pct:0,bh=known?Math.max(1,half*Math.abs(v)/max):1,up=v>=0,col=!known?"#8c959f":up?"#1a7f37":"#cf222e";
    const r=add("rect",{x:x,y:up?mid-bh:mid,width:bw,height:bh,rx:2,fill:col});
    const t=document.createElementNS(ns,"title");t.textContent=s.label+": "+usd(s.pnl)+" USD ("+(known?sgn(v,2)+"%":"% n/a")+") per account; "+s.trades+" trades closed ("+s.wins+" won / "+s.losses+" lost"+(s.trades?", "+Math.round(s.wins/s.trades*100)+"% win rate":"")+") across "+(s.runs??"?")+" runs";r.append(t);
    if(known&&i-lastLabel>=every&&(lastLabel=i,true))add("text",{x:x+bw/2,y:up?mid-bh-2:mid+bh+9,"text-anchor":"middle",fill:col},sgn(v,1)+"%");
    if(i%Math.ceil(series.length/8)===0)add("text",{x:x,y:hgt-3,fill:"currentColor"},s.label);});
  add("text",{x:0,y:9,fill:"currentColor"},"±"+max.toFixed(1)+"%");return svg;}

// --- charts for the AI agents (same look as pnlBars: green up = gain, red down = loss, grey = nothing / reference)
const NS="http://www.w3.org/2000/svg";
function svgBox(w,hgt){const svg=document.createElementNS(NS,"svg");svg.setAttribute("viewBox",`0 0 ${w} ${hgt}`);svg.setAttribute("width","100%");svg.style.font="9px system-ui";
  const add=(tag,a,txt)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;svg.append(e);return e;};
  const tip=(el,txt)=>{const t=document.createElementNS(NS,"title");t.textContent=txt;el.append(t);};return {svg,add,tip};}
const shortDate=ts=>new Date(ts*1000).toLocaleDateString([], {month:"2-digit",day:"2-digit"});
// an axis label: the date, or the time of day when the axis spans less than two days
const axisLabel=(ts,span)=>span<2*86400?new Date(ts*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):shortDate(ts);
// Per-block returns of a variant (bars) next to the current strategy on the same blocks (grey tick); dashed line = where the
// agents' view ends: blocks left of it are the training half they see, right of it the unseen half the code judges on.
function blockBars(run,w=640,hgt=200){
  const b=run.blocks||[];if(!b.length)return h("div",{class:"empty"},"no per-block data yet");
  const {svg,add,tip}=svgBox(w,hgt),T=16,B=18,mid=(hgt-T-B)/2+T,half=(hgt-T-B)/2-12;
  const max=Math.max(0.5,...b.map(x=>Math.abs(x.ret)),...b.map(x=>Math.abs(x.base??0))),step=(w-34)/b.length,bw=Math.max(3,Math.min(24,step-4));
  add("line",{x1:28,x2:w,y1:mid,y2:mid,stroke:"var(--line,#ccc)"});
  b.forEach((x,i)=>{const X=30+i*step,none=x.trades===0;
    const bh=none?2:Math.max(1,half*Math.abs(x.ret)/max),up=x.ret>=0,col=none?"#8c959f":up?"#1a7f37":"#cf222e";
    const r=add("rect",{x:X,y:none?mid-1:up?mid-bh:mid,width:bw,height:bh,rx:2,fill:col});
    tip(r,shortDate(x.start)+" block: "+(none?"no trade":sgn(x.ret,2)+"%")+" ("+x.trades+" trades, "+x.wins+" won) vs current "+(x.base==null?"n/a":sgn(x.base,2)+"%")+(i<run.split?" — training half (agents saw this)":" — unseen half (judged by code)"));
    if(x.base!=null){const by=mid-(half*x.base/max);add("line",{x1:X-2,x2:X+bw+2,y1:by,y2:by,stroke:"#57606a","stroke-width":2});}
    if(!none&&step>=18)add("text",{x:X+bw/2,y:up?mid-bh-3:mid+bh+9,"text-anchor":"middle",fill:col},sgn(x.ret,1));
    if(i%Math.ceil(b.length/9)===0&&i<b.length-2)add("text",{x:X,y:hgt-4,fill:"currentColor"},shortDate(x.start));});
  add("text",{x:w-2,y:hgt-4,"text-anchor":"end",fill:"currentColor"},shortDate(b[b.length-1].start));
  const sx=30+run.split*step-2;add("line",{x1:sx,x2:sx,y1:T-6,y2:hgt-B,stroke:"#8250df","stroke-dasharray":"4 3"});
  add("text",{x:sx-4,y:T-2,"text-anchor":"end",fill:"#8250df"},"training half (agents see) ◀");add("text",{x:sx+4,y:T-2,fill:"#8250df"},"▶ unseen half (code judges)");
  add("text",{x:0,y:mid-half-2,fill:"currentColor"},"+"+max.toFixed(1)+"%");add("text",{x:0,y:mid+half+8,fill:"currentColor"},"-"+max.toFixed(1)+"%");return svg;}
// Line chart: series [{name,color,points:[[x,y],...]}]; x = unix seconds or index; yFmt formats the axis.
function lines(series,{w=640,hgt=180,yFmt=v=>fmt(v,0),xDate=true,zero=null}={}){
  const all=series.flatMap(s=>s.points);if(!all.length)return h("div",{class:"empty"},"no data yet");
  const {svg,add,tip}=svgBox(w,hgt),L=46,R=8,T=10,B=18;
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]).concat(zero==null?[]:[zero]),x0=Math.min(...xs),x1=Math.max(...xs,x0+1),y0=Math.min(...ys),y1=Math.max(...ys,y0+1e-9);
  const X=x=>L+(x-x0)/(x1-x0)*(w-L-R),Y=y=>T+(y1-y)/(y1-y0||1)*(hgt-T-B);
  [y0,(y0+y1)/2,y1].forEach(v=>{add("line",{x1:L,x2:w-R,y1:Y(v),y2:Y(v),stroke:"var(--line,#e1e5eb)"});add("text",{x:2,y:Y(v)+3,fill:"currentColor"},yFmt(v));});
  if(zero!=null&&zero>y0&&zero<y1)add("line",{x1:L,x2:w-R,y1:Y(zero),y2:Y(zero),stroke:"#8c959f","stroke-dasharray":"3 3"});
  [x0,(x0+x1)/2,x1].forEach((v,i)=>add("text",{x:X(v),y:hgt-4,"text-anchor":i===0?"start":i===2?"end":"middle",fill:"currentColor"},xDate?axisLabel(v,x1-x0):fmt(v,0)));
  series.forEach(s=>{if(!s.points.length)return;add("path",{d:s.points.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(""),fill:"none",stroke:s.color,"stroke-width":s.width||2});
    const lp=s.points[s.points.length-1],c=add("circle",{cx:X(lp[0]),cy:Y(lp[1]),r:3,fill:s.color});tip(c,s.name+": "+yFmt(lp[1]));});
  return svg;}
// Horizontal bars, centred on zero: items [{label,value,note}]
function hbars(items,{w=640,unit=" pts",d=2}={}){
  if(!items.length)return h("div",{class:"empty"},"no data yet");
  const rowH=20,hgt=items.length*rowH+8,{svg,add,tip}=svgBox(w,hgt),L=170,R=70,mid=L+(w-L-R)/2,max=Math.max(0.1,...items.map(i=>Math.abs(i.value??0)));
  add("line",{x1:mid,x2:mid,y1:0,y2:hgt,stroke:"#8c959f"});
  items.forEach((it,i)=>{const y=4+i*rowH,v=it.value??0,len=(w-L-R)/2*Math.abs(v)/max,col=it.value==null?"#8c959f":v>=0?"#1a7f37":"#cf222e";
    add("text",{x:0,y:y+12,fill:"currentColor"},it.label);const r=add("rect",{x:v>=0?mid:mid-len,y:y+2,width:Math.max(1,len),height:rowH-6,rx:2,fill:col});tip(r,it.label+": "+(it.value==null?"n/a":sgn(v,d)+unit)+(it.note?" — "+it.note:""));
    add("text",{x:w-R+4,y:y+12,fill:col},it.value==null?"—":sgn(v,d)+unit);});return svg;}
// Vertical bars: items [{label,v,note,ref}] (green up / red down, grey tick = reference value); `unit` is added to the labels.
function colBars(items,{w=640,hgt=170,unit="",d=1}={}){
  if(!items.length)return h("div",{class:"empty"},"no data yet");
  const {svg,add,tip}=svgBox(w,hgt),T=14,B=18,L=34,mid=(hgt-T-B)/2+T,half=(hgt-T-B)/2-8,step=(w-L-4)/items.length,bw=Math.max(4,Math.min(40,step-4));
  const max=Math.max(1e-9,...items.map(i=>Math.abs(i.v??0)),...items.map(i=>Math.abs(i.ref??0)));
  add("line",{x1:L-4,x2:w,y1:mid,y2:mid,stroke:"var(--line,#ccc)"});add("text",{x:0,y:T,fill:"currentColor"},"+"+fmt(max,d));add("text",{x:0,y:hgt-B,fill:"currentColor"},"-"+fmt(max,d));
  items.forEach((it,i)=>{const X=L+i*step,v=it.v,up=(v??0)>=0,bh=v==null?1:Math.max(1,half*Math.abs(v)/max),col=v==null?"#8c959f":up?"#1a7f37":"#cf222e";
    const r=add("rect",{x:X,y:up?mid-bh:mid,width:bw,height:bh,rx:2,fill:col});tip(r,it.label+": "+(v==null?"n/a":sgn(v,d)+unit)+(it.note?" — "+it.note:""));
    if(it.ref!=null){const y=mid-half*it.ref/max;add("line",{x1:X-2,x2:X+bw+2,y1:y,y2:y,stroke:"#57606a","stroke-width":2});}
    if(step>=22&&v!=null)add("text",{x:X+bw/2,y:up?mid-bh-3:mid+bh+9,"text-anchor":"middle",fill:col},sgn(v,d));
    if(i%Math.ceil(items.length/10)===0)add("text",{x:X,y:hgt-4,fill:"currentColor"},String(it.label).slice(0,12));});
  return svg;}
// Points with intervals in the order they happened: items [{v,lo,hi,hl,kind}]; green = interval above zero, highlighted ring = champion.
function errPoints(items,{w=640,hgt=190,d=3}={}){
  const ok=items.filter(i=>i.v!=null);if(!ok.length)return h("div",{class:"empty"},"no data yet");
  const {svg,add,tip}=svgBox(w,hgt),L=48,T=10,B=18,lo=Math.min(0,...ok.map(i=>i.lo??i.v)),hi=Math.max(0,...ok.map(i=>i.hi??i.v)),Y=y=>T+(hi-y)/((hi-lo)||1)*(hgt-T-B),step=(w-L-6)/items.length;
  [lo,0,hi].forEach(v=>{add("line",{x1:L,x2:w-4,y1:Y(v),y2:Y(v),stroke:v===0?"#8c959f":"var(--line,#e1e5eb)","stroke-dasharray":v===0?"3 3":""});add("text",{x:2,y:Y(v)+3,fill:"currentColor"},sgn(v,d));});
  items.forEach((it,i)=>{if(it.v==null)return;const X=L+i*step+step/2,good=(it.lo??-1)>0,col=good?"#1a7f37":it.kind==="Transformer"?"#8250df":"#0969da";

let failures=0,page=null,restored=false;
// Fetches a fresh snapshot and renders it; on failure marks the dashboard as unable to reach the lab.
async function tick(){
  try{const r=await fetch("/api/snapshot",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();
    // the dashboard was updated (new page code): reload once to show it, keeping the scroll position
    if(page&&d.page&&d.page!==page){try{sessionStorage.setItem("scroll",String(scrollY));}catch(e){}location.reload();return;}
    // a snapshot the server built more than 2 minutes ago is not current (clock or cache fault): never shown as current
    if(Math.abs(Date.now()/1000-d.generated)>120)throw new Error("the lab's data is "+Math.round((Date.now()/1000-d.generated)/60)+" min old");
    page=d.page;render(d);failures=0;
    if(!restored){restored=true;try{const y=+sessionStorage.getItem("scroll");if(y)scrollTo(0,y);sessionStorage.removeItem("scroll");}catch(e){}}}
  catch(e){failures++;const st=$("#status");st.className="pill bad";st.replaceChildren(h("i"),h("span",null,"dashboard cannot reach the lab ("+e.message+")"));
    // owner 2026-10-11: nothing stale is ever presented: after a failed refresh the old numbers are hidden, not shown as current
    if(failures>=2){const a=$("#app");a.replaceChildren(h("div",{class:"card",style:"padding:24px;text-align:center"},"The lab is not answering, so no data is shown: everything on this page must be current. It reappears as soon as the lab answers ("+e.message+")."));}}
}

const LOGS=["improve","brain","trainer","tick","supervisor","monitor"];
let logName=(()=>{try{return localStorage.getItem("log")||"improve";}catch(e){return "improve";}})();

  b.onclick=()=>{logName=n;try{localStorage.setItem("log",n);}catch(e){}logTabs();logTick(true);};return b;}));}
async function logTick(jump){
  const pre=$("#logtext");const atEnd=jump||pre.scrollTop+pre.clientHeight>=pre.scrollHeight-20;
  try{const r=await fetch("/api/logs?name="+logName+"&n=200",{cache:"no-store"});const d=await r.json();if(d.error)throw new Error(d.error);
