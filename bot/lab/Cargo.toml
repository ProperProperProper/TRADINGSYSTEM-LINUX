[package]
name = "qwen-lab"
version = "0.1.0"
edition = "2021"
description = "Standalone Rust research lab: code and small statistical models propose hypotheses, deterministic code judges them."

[dependencies]
anyhow = "1"
csv = "1"
hex = "0.4"
regex = "1"
fancy-regex = "0.13"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "0.31"
rand = "0.8"
rand_chacha = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
smartcore = "=0.4.0"

[profile.release]
opt-level = 3
