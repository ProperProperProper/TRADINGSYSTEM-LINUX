[package]
name = "moomoo-bot"
version = "0.1.0"
edition = "2021"
description = "Mean-reversion paper bot for US stocks over moomoo OpenD (all Rust)"
publish = false

[dependencies]
anyhow = "1"
prost = "0.14"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.29", features = ["bundled"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
regex = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
prost-build = "0.14"

[profile.release]
opt-level = 3
